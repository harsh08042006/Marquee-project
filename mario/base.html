<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ground{
            width: 90vw;
            height: 50px;
            background-color: green;
            position: relative;
            top: 250px;
            border: 2px solid;
        }
        .mario{
            width: 5%;
            height: 50px;
            background-color: brown;
            position: relative;
            top: 150px; 
        }
        .obs{
           width: 5%;
            height: 50px;
            background-color:greenyellow;
            position: relative;
            top: 98px; 
            left: 250px;
        }
        .popup{
            height: 150px;
            width: 300px;
            position: absolute;
            z-index: 100;
            top: 30%;
            left: 40%;
            border: 1px solid ;
            border-radius: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;

        }
    </style>
</head>
<body>
    <div class="ground"></div>
    <div class="mario"></div>
    <div class="obs"></div>
    <div class="popup">Game Over

    </div>
    <script>
        let mario=document.querySelector(".mario");
        let obs=document.querySelector(".obs")
        let isJumping=false;
        let currentTop=150;
        let maxtop=30;
        let ground=150;
        let velocity=-15;
        let gravity=5;
        let direction='up';
        let currentleft=0;
        let movingspeed=25;
        let gameover=false;
        let obstacle=[];
       

    function jump(){
       if(isJumping){
        if(direction=='up' && currentTop>=maxtop){
        currentTop+=velocity;
        mario.style.top=currentTop+'px';

    }
    else if(direction=='up' && currentTop<=maxtop){
        direction='down';
    }
    else if(direction=='down' && currentTop<ground){
        currentTop+=gravity;
        mario.style.top=currentTop+'px';
    }
    else if(direction=='down' && currentTop>=maxtop){
        direction='up';
        
        return;
    }
}
    requestAnimationFrame(jump);
}
 function right(){
      
     currentleft+=movingspeed;
      mario.style.left=currentleft+'px';
 }
  function left(){
      if(currentleft>0){
      currentleft-=movingspeed;
      mario.style.left=currentleft+'px';}
 }
 function iscolliding(){
      let mariorect=mario.getBoundingClientRect();
        let obsrect=obs.getBoundingClientRect();
        if(mariorect.x >= (obsrect.x - mariorect.width) && mariorect.x <= obsrect.x+mariorect.width){
            gameover=true;
            
        }
        else if((mariorect.bottom>=obsrect.top)&&(currentleft>=obsrect.x&&currentleft<=(obsrect.x+obsrect.width))){
            gameover=true;
            
        }
       if(gameover){
        alert("game over");
        gameover=false;
        return;
       }
        requestAnimationFrame(iscolliding);
        
 }
window.addEventListener('keydown',(event)=>{
    if(event.key=='ArrowUp'){
        direction='up';
        isJumping=true;
        jump();
    }
    if(event.key=='ArrowRight'){
        right();
    }
    if(event.key=='ArrowLeft'){
        left();
    }
})

iscolliding();


    </script>
</body>
</html>
