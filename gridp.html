<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body,.body{
    display: flex;
    justify-content: center;
    align-items: center;
    background-color:cadetblue;
}
.cont{
    display: grid;
    grid-template-columns: repeat(3,300px);
    grid-template-rows: repeat(3,200px);
    gap: 10px;
    background-color: blueviolet;
    width: 950px;
    justify-self: center;
    
}
.b6{
    grid-row: 2/4;
    grid-column: 3/4;
    border-radius: 20px;
     display: flex;
    flex-direction: column;
    justify-content:space-between;
    align-items: center;
    color: black;
}
.b7{
    grid-column: 1/3;
    border-radius: 20px;
    color: aliceblue;
   
}
.b1{
    border-radius: 20px;
}
.b2{
    border-radius: 20px;
   
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: aliceblue;
}
.b3{
    border-radius: 20px;
    display: flex;
    color: aliceblue;
    align-items: center;
    justify-content: center;
}
.b4{
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    color: aliceblue;
}
.b5{
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}
h1{
 font-size: 60px;
}
h3{
   left: 5px;
}

    </style>
</head>
<body>
    <div class="cont">
        <div class="b1" style="background-color: purple;"></div>
         <div class="b2" style="background-color: purple;"><h1>25K</h1></div>
          <div class="b3" style="background-color: purple;"><h1>50K</h1></div>
           <div class="b4" style="background-color: purple;">Active Users<h1>1,538</h1></div>
            <div class="b5" style="background-color:hsla(260, 91%, 46%, 0.419);"><h1>DESIGN</h1></div>
             <div class="b6" style="background-color: whitesmoke;"><h3>Total Subscriber</h3><h1>200K</h1></div>
              <div class="b7" style="background-color: purple;"><h4>A place to learn UI Design & Web Design.</h4></div>
    </div>
</body>
</html>
