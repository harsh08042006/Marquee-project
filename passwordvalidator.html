<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <input type="text">
    <p class="p"></p>
    <!-- //pasword validator (one uppercase character,one special character,and aleast 8 character) -->
    <script>

       let specialcharacter=['!','@','#','$','%','^','&','*'];
       let input=document.querySelector("input");
       let sp=document.querySelector("p");
       input.addEventListener('input',(event)=>{
             let str=event.target.value; 
                    let Tcount=0;
                    let scount=0;
                    let ucount=0;
                      
        for(let i=0;i<str.length;i++){
            let char=str.charAt(i);
            if(char>='A'&& char<='Z'){
                Tcount++;
                ucount++;
            }
            else if(specialcharacter.includes(char)){
                scount++;
                Tcount++;
            }
            else{
                Tcount++;

            }
           }
            if(ucount<1&&Tcount<8&&scount<1){
                sp.innerHTML=`<h3>Password must have 1 uppercase and 1 special character and must have 8 character</h3>`
            }
            if(ucount<1&&Tcount>=8&&scount>=1){
                sp.innerHTML=`<h3 style="color=red">Password must have 1 uppercase</h3>`
            }
             if(ucount<1&&Tcount>=8&&scount<1){
                sp.innerHTML=`<h3 style="color=red">Password must have 1 specialcharacter and uppercase character</h3>`
            }
             if(ucount>=1&&Tcount<8&&scount>=1){
                sp.innerHTML=`<h3 style="color=red">Password must have 8 character</h3>`
            }
            if(ucount>=1 && Tcount>=8 && scount<1){
                sp.innerHTML=`<h3 style="color=red">Password must have 1 specialcharacter `
            }
             if(ucount>=1&&Tcount>=8&&scount>=1){
                sp.innerHTML=`<h3 style="color=red">Password is valid</h3>`
            }

                
       })


    </script>
</body>
</html>
